<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Fanta Conte: laboratorio personale per preparare l'asta Fantacalcio.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Fanta Conte RC2</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">LABORATORIO ASTA</p>
      <h1>⚽ Fanta Conte <span>RC2</span></h1>
    </div>
    <button id="installBtn" class="install-btn" hidden>Installa app</button>
  </header>

  <main>
    <section class="summary" aria-label="Riepilogo">
      <div><strong id="countAll">0</strong><span>Giocatori</span></div>
      <div><strong id="countFav">0</strong><span>Preferiti</span></div>
      <div><strong id="countVisible">0</strong><span>Visibili</span></div>
    </section>

    <section class="controls">
      <label class="search">
        <span>🔎</span>
        <input id="q" type="search" placeholder="Cerca giocatore o squadra…" autocomplete="off">
      </label>

      <div class="role-tabs" id="roleTabs" aria-label="Filtra per ruolo">
        <button class="active" data-role="TUTTI">Tutti</button>
        <button data-role="P">P</button>
        <button data-role="D">D</button>
        <button data-role="C">C</button>
        <button data-role="A">A</button>
        <button data-role="PREFERITI">★</button>
      </div>
    </section>

    <p class="notice">RC2 di prova: struttura pronta per il listone completo e gli aggiornamenti di mercato.</p>
    <section id="list" class="player-list" aria-live="polite"></section>
  </main>

  <dialog id="playerDialog">
    <form method="dialog" id="playerForm">
      <button class="close" value="cancel" aria-label="Chiudi">×</button>
      <p class="eyebrow" id="dialogMeta"></p>
      <h2 id="dialogName"></h2>

      <label>Fascia personale
        <select id="tier">
          <option value="">Non assegnata</option>
          <option value="TOP">Top</option>
          <option value="TITOLARE">Titolare</option>
          <option value="SCOMMESSA">Scommessa</option>
          <option value="EVITA">Da evitare</option>
        </select>
      </label>
      <label>Prezzo massimo
        <input id="maxPrice" type="number" min="0" inputmode="numeric" placeholder="Crediti">
      </label>
      <label>Note personali
        <textarea id="notes" rows="4" placeholder="Rigori, ballottaggio, infortuni, strategia…"></textarea>
      </label>
      <button class="save" value="default">Salva valutazione</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
